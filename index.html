<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RXHUNT v20.0 | CYBER-SURFER OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f3ff;
            --neon-alt: #ff0055;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.2);
            --bg: #00050a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg); color: #fff;
            font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden;
            background-image: radial-gradient(circle at top right, #002233, #000);
        }

        /* --- iOS 26 Glass UI Components --- */
        .glass-panel {
            background: var(--glass); backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--border); border-radius: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* --- Master Lock --- */
        #master-lock {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; justify-content: center; align-items: center;
        }
        .lock-box { width: 320px; padding: 40px; text-align: center; border-radius: 30px; border: 1px solid var(--neon); }
        .lock-input { 
            background: transparent; border: none; border-bottom: 2px solid var(--neon); 
            color: var(--neon); font-size: 32px; text-align: center; width: 80%; outline: none; margin: 20px 0; letter-spacing: 8px;
        }

        /* --- Status Bar --- */
        .status-bar {
            position: fixed; top: 0; width: 100%; height: 60px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; z-index: 1000; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
        }

        /* --- Right HUD (Widgets) --- */
        .hud-right { position: fixed; right: 20px; top: 80px; width: 260px; display: flex; flex-direction: column; gap: 15px; }
        .widget { padding: 20px; }
        .bar-bg { height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--neon); box-shadow: 0 0 15px var(--neon); }

        /* --- Universal Windows --- */
        .window {
            position: absolute; top: 80px; left: 30px; right: 300px; bottom: 120px;
            display: none; flex-direction: column; z-index: 100;
        }
        .win-head { padding: 15px 25px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); font-family: 'Syncopate'; font-size: 10px; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; border-radius: 0 0 25px 25px; }

        /* --- CYBER SURFER GAME (Canvas Based) --- */
        #game-view { background: #000; position: relative; overflow: hidden; border-radius: 25px; }
        #game-canvas { width: 100%; height: 100%; }
        .game-overlay { position: absolute; top: 20px; left: 20px; font-family: 'Syncopate'; color: var(--neon); }
        #puzzle-prompt {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200;
        }

        /* --- Dock --- */
        .ios-dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; padding: 12px 20px; background: rgba(255,255,255,0.15);
            backdrop-filter: blur(40px); border-radius: 35px; border: 1px solid var(--border); z-index: 2000;
        }
        .icon { 
            width: 60px; height: 60px; border-radius: 16px; background: #000; 
            display: flex; justify-content: center; align-items: center; font-size: 28px;
            border: 1px solid var(--border); cursor: pointer;
        }
        .icon:hover { transform: translateY(-10px) scale(1.1); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        input[type="text"] { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 10px; }
        .btn { background: var(--neon); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="master-lock">
        <div class="lock-box glass-panel">
            <h2 style="font-family: 'Syncopate'; font-size: 12px;">SYSTEM_LOCKED_v20</h2>
            <input type="password" id="main-pass" class="lock-input" maxlength="4" placeholder="••••">
            <button class="btn" onclick="unlockOS()" style="width: 100%;">ACCESS_VAULT</button>
        </div>
    </div>

    <div id="main-os" style="display: none;">
        <div class="status-bar">
            <div style="font-family: 'Syncopate'; font-size: 10px;">RXHUNT // iOS_26_EDITION</div>
            <div id="clock" style="font-size: 20px; font-weight: 500;">00:00:00</div>
            <div style="color: var(--neon);">SAFE_MODE_ON</div>
        </div>

        <div class="hud-right">
            <div class="widget glass-panel">
                <div class="label">PERFORMANCE</div>
                <div style="font-size: 12px; margin-top:10px;">CPU_LOAD: 18%</div>
                <div class="bar-bg"><div class="bar-fill" style="width: 18%;"></div></div>
                <div style="font-size: 12px; margin-top:10px;">GPU_TEMP: 42°C</div>
                <div class="bar-bg"><div class="bar-fill" style="width: 42%; background: var(--neon-alt);"></div></div>
            </div>
            <div class="widget glass-panel">
                <div class="label">WEATHER</div>
                <div style="font-size: 22px; font-weight: bold;">SYLHET: 26°C</div>
                <div style="font-size: 12px; opacity: 0.6;">PARTLY CLOUDY</div>
            </div>
        </div>

        <div id="win-app" class="window glass-panel">
            <div class="win-head"><span>APPLICATION_VIEWER</span> <button onclick="closeWin('win-app')" style="color:red; background:none; border:none;">[CLOSE]</button></div>
            <iframe id="app-frame" src=""></iframe>
        </div>

        <div id="win-game" class="window glass-panel" style="display: flex;">
            <div class="win-head"><span>CYBER_SURFER_v1.0</span> <button onclick="closeWin('win-game')" style="color:red; background:none; border:none;">[EXIT]</button></div>
            <div id="game-view" style="flex: 1;">
                <div class="game-overlay">
                    LEVEL: <span id="g-lvl">1</span> | CODES: <span id="g-score">0/3</span>
                </div>
                <canvas id="game-canvas"></canvas>
                
                <div id="puzzle-prompt">
                    <h3 style="font-family: 'Syncopate';">TERMINAL_LOCKED</h3>
                    <p id="puzzle-hint">Enter the codes you saw in sky:</p>
                    <input type="text" id="puzzle-input" class="lock-input" style="letter-spacing: 2px; font-size: 20px;">
                    <button class="btn" onclick="checkPuzzle()">SOLVE_AND_PROCEED</button>
                </div>
            </div>
        </div>

        <div id="win-ctrl" class="window glass-panel">
            <div class="win-head"><span>SYSTEM_CONTROLLER</span> <button onclick="closeWin('win-ctrl')" style="color:red; background:none; border:none;">[X]</button></div>
            <div style="padding: 30px;">
                <h3>ADD NEW SYSTEM</h3>
                <input type="text" id="sys-name" placeholder="App Name" style="width:100%; margin-bottom:10px;">
                <input type="text" id="sys-url" placeholder="URL (https://...)" style="width:100%; margin-bottom:20px;">
                <button class="btn" onclick="addSystem()" style="width:100%;">DEPLOY_SYSTEM</button>
                <div id="sys-list" style="margin-top:30px; display:grid; grid-template-columns: repeat(3, 1fr); gap:15px;"></div>
            </div>
        </div>

        <div class="ios-dock">
            <div class="icon" title="Controller" onclick="openWin('win-ctrl')">🎮</div>
            <div class="icon" title="Gemini" onclick="launchApp('Gemini', 'https://gemini.google.com')">🧠</div>
            <div class="icon" title="YouTube" onclick="launchApp('YouTube', 'https://www.youtube.com')">📺</div>
            <div class="icon" title="Game" onclick="openWin('win-game')">🏃</div>
            <div class="icon" title="Movies" onclick="launchApp('Movies', 'https://moviebox.id')">🎬</div>
        </div>
    </div>

    <script>
        const MASTER_KEY = "4455";
        let systems = JSON.parse(localStorage.getItem('rx_sys')) || [];
        
        // --- OS LOGIC ---
        function unlockOS() {
            if(document.getElementById('main-pass').value === MASTER_KEY) {
                document.getElementById('master-lock').style.display = 'none';
                document.getElementById('main-os').style.display = 'block';
                initGame();
            } else { alert("ACCESS DENIED"); }
        }

        function openWin(id) { 
            document.querySelectorAll('.window').forEach(w => w.style.display = 'none');
            document.getElementById(id).style.display = 'flex'; 
        }
        function closeWin(id) { document.getElementById(id).style.display = 'none'; }

        function launchApp(name, url) {
            document.getElementById('app-frame').src = url;
            openWin('win-app');
        }

        function addSystem() {
            const n = document.getElementById('sys-name').value;
            const u = document.getElementById('sys-url').value;
            if(n && u) {
                systems.push({n, u});
                localStorage.setItem('rx_sys', JSON.stringify(systems));
                renderSystems();
            }
        }

        function renderSystems() {
            document.getElementById('sys-list').innerHTML = systems.map(s => 
                `<button class="btn" style="font-size:10px;" onclick="launchApp('${s.n}', '${s.u}')">${s.n}</button>`
            ).join('');
        }

        // --- CYBER SURFER GAME ENGINE (iOS style) ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let gameActive = false;
        let player = { x: 1, lane: 1, animFrame: 0 }; // Lane 0, 1, 2
        let skyCodes = [];
        let collectedCodes = "";
        let obstacles = [];
        let level = 1;
        let speed = 5;

        function initGame() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            window.addEventListener('keydown', (e) => {
                if(e.key === "ArrowLeft" && player.lane > 0) player.lane--;
                if(e.key === "ArrowRight" && player.lane < 2) player.lane++;
            });
            // Support for Touch
            canvas.addEventListener('touchstart', (e) => {
                let x = e.touches[0].clientX;
                if(x < window.innerWidth/2) { if(player.lane > 0) player.lane--; }
                else { if(player.lane < 2) player.lane++; }
            });
            gameLoop();
        }

        function spawnSkyCode() {
            if(Math.random() < 0.02 && skyCodes.length < 3) {
                const char = Math.floor(Math.random() * 9);
                skyCodes.push({ x: Math.random() * canvas.width, y: -50, val: char });
            }
        }

        function gameLoop() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            // Draw 3 Lanes (iOS 26 Style)
            ctx.strokeStyle = "rgba(0, 243, 255, 0.2)";
            for(let i=1; i<3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * canvas.width/3, 0);
                ctx.lineTo(i * canvas.width/3, canvas.height);
                ctx.stroke();
            }

            // Draw Character (Anime style circle for now)
            ctx.fillStyle = var(--neon-alt);
            ctx.beginPath();
            ctx.arc((player.lane * canvas.width/3) + canvas.width/6, canvas.height - 80, 25, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.fillText("RUNNER", (player.lane * canvas.width/3) + canvas.width/6 - 20, canvas.height - 75);

            // Sky Codes
            spawnSkyCode();
            skyCodes.forEach((code, index) => {
                code.y += speed;
                ctx.font = "bold 30px Syncopate";
                ctx.fillStyle = var(--neon);
                ctx.fillText(code.val, code.x, code.y);
                
                // Collect logic
                if(code.y > canvas.height - 100 && code.y < canvas.height) {
                    collectedCodes += code.val;
                    skyCodes.splice(index, 1);
                    document.getElementById('g-score').innerText = collectedCodes.length + "/3";
                    if(collectedCodes.length >= 3) triggerPuzzle();
                }
            });

            if(gameActive) requestAnimationFrame(gameLoop);
        }

        function triggerPuzzle() {
            gameActive = false;
            document.getElementById('puzzle-prompt').style.display = 'flex';
            document.getElementById('puzzle-hint').innerText = "SYSTEM_LOCKED! ENTER CODES: " + collectedCodes;
        }

        function checkPuzzle() {
            const input = document.getElementById('puzzle-input').value;
            if(input === collectedCodes) {
                alert("ACCESS GRANTED! LEVEL " + level + " COMPLETE");
                level++;
                document.getElementById('g-lvl').innerText = level;
                resetLevel();
            } else {
                alert("WRONG CODE! REBOOTING LEVEL");
                resetLevel();
            }
        }

        function resetLevel() {
            collectedCodes = "";
            skyCodes = [];
            document.getElementById('puzzle-prompt').style.display = 'none';
            document.getElementById('puzzle-input').value = "";
            gameActive = true;
            gameLoop();
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        window.onload = renderSystems;
        gameActive = true;
    </script>
</body>
</html>
