<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIFAT MINI MARKET | Athens</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff6b6b;
            --glass: rgba(255, 255, 255, 0.6);
            --border: rgba(255, 255, 255, 0.4);
            --bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { margin: 0; background: var(--bg); color: #2d3436; min-height: 100vh; overflow-x: hidden; }

        /* iOS Glass Header */
        header {
            position: sticky; top: 15px; margin: 0 15px;
            background: var(--glass); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 25px;
            padding: 12px 25px; display: flex; justify-content: space-between;
            align-items: center; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .shop-name { font-family: 'Syncopate'; font-size: 14px; color: #d63031; }

        /* Search Bar */
        .search-container { margin: 80px 20px 20px; text-align: center; }
        #search-bar {
            width: 100%; max-width: 500px; padding: 15px 25px;
            border-radius: 50px; border: 1px solid var(--border);
            background: var(--glass); backdrop-filter: blur(10px);
            outline: none; font-size: 16px; box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        /* Product Grid */
        .container { padding: 0 20px 40px; max-width: 1100px; margin: auto; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }

        .item-card {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 35px;
            padding: 15px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.02);
        }
        .item-card:hover { transform: translateY(-8px); background: rgba(255,255,255,0.8); }
        .item-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 25px; }

        .btn-add {
            background: #2d3436; color: white; border: none; width: 100%;
            padding: 12px; border-radius: 20px; cursor: pointer; font-weight: 600; margin-top: 10px;
        }

        /* Cart Drawer */
        #cart-drawer {
            position: fixed; right: -100%; top: 0; width: 380px; height: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(30px);
            z-index: 4000; box-shadow: -10px 0 40px rgba(0,0,0,0.1);
            padding: 30px; transition: 0.5s; overflow-y: auto;
        }
        #cart-drawer.active { right: 0; }
        .cart-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: white; padding: 15px; border-radius: 20px; margin-bottom: 10px;
        }
        .del-btn { background: #ff7675; border: none; color: white; padding: 5px 10px; border-radius: 10px; cursor: pointer; }

        /* Toast Notification */
        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: #2d3436; color: white; padding: 12px 30px;
            border-radius: 50px; font-weight: bold; transition: 0.5s; z-index: 9999;
        }

        /* Owner Panel */
        .admin-gear { position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; background: #000; color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 5000; }
        #admin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); display: none; justify-content: center; align-items: center; z-index: 6000; }
        .modal-content { background: white; padding: 30px; border-radius: 40px; width: 90%; max-width: 450px; max-height: 80vh; overflow-y: auto; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 15px; border: 1px solid #eee; outline: none; }
    </style>
</head>
<body>

    <header>
        <div class="shop-name" id="shop-title">RIFAT MINI MARKET</div>
        <div onclick="toggleCart()" style="cursor:pointer; font-size: 20px;">🛒 <span id="count">0</span></div>
    </header>

    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Search groceries (e.g. Milk, Rice)..." onkeyup="searchProducts()">
    </div>

    <div class="container">
        <div class="product-grid" id="product-list">
            <div class="item-card" data-name="Fresh Milk">
                <img src="https://images.unsplash.com/photo-1550583724-125581fe2f8a?auto=format&fit=crop&w=300" alt="Milk">
                <h3>Fresh Milk</h3>
                <p style="color:var(--accent); font-weight:bold;">€ 1.50</p>
                <button class="btn-add" onclick="addToCart('Fresh Milk', 1.50)">Add to Cart</button>
            </div>
        </div>

        <div style="margin-top: 50px; border-radius: 30px; overflow: hidden; border: 5px solid white;">
            <iframe id="loc-map" src="http://googleusercontent.com/maps.google.com/2" width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <div id="cart-drawer">
        <h2 style="font-family: 'Syncopate'; font-size: 18px;">Shopping Basket</h2>
        <div id="basket-items"></div>
        <div style="margin-top:20px; border-top: 1px solid #ddd; padding-top: 20px;">
            <h3>Total: € <span id="total-price">0.00</span></h3>
            <button class="btn-add" style="background:#00b894;" onclick="checkoutWhatsApp()">Checkout via WhatsApp</button>
            <button class="btn-add" style="background:#eee; color:#333;" onclick="toggleCart()">Continue Shopping</button>
        </div>
    </div>

    <div id="toast">Item added to cart! 🛒</div>

    <div class="admin-gear" onclick="toggleAdmin()">⚙️</div>
    <div id="admin-modal">
        <div class="modal-content">
            <h2 style="font-family: 'Syncopate';">Shop Manager</h2>
            <label>Business WhatsApp (e.g. 3069XXXXXXXX)</label>
            <input type="text" id="owner-phone" placeholder="30XXXXXXXX">
            <label>Shop Name</label>
            <input type="text" id="new-name" placeholder="RIFAT MINI MARKET">
            <label>Map Link (src)</label>
            <input type="text" id="new-map" placeholder="Google Maps Embed URL">
            <hr>
            <h3>Add New Item</h3>
            <input type="text" id="p-name" placeholder="Item Name">
            <input type="number" id="p-price" step="0.01" placeholder="Price €">
            <input type="text" id="p-img" placeholder="Image Link">
            <button class="btn-add" style="background:#0984e3;" onclick="saveConfig()">Save Settings</button>
            <p onclick="toggleAdmin()" style="text-align:center; color:red; cursor:pointer;">Cancel</p>
        </div>
    </div>

    <script>
        let cart = [];
        let waPhone = "306900000000"; // Replace with your Greek WhatsApp Number

        function toggleCart() { document.getElementById('cart-drawer').classList.toggle('active'); }
        function toggleAdmin() { let m = document.getElementById('admin-modal'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }

        function addToCart(name, price) {
            cart.push({name, price, id: Date.now()});
            updateUI();
            showToast(`Added ${name}!`);
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateUI();
        }

        function updateUI() {
            const basket = document.getElementById('basket-items');
            basket.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                basket.innerHTML += `
                    <div class="cart-item">
                        <div><b>${item.name}</b><br><small>€ ${item.price.toFixed(2)}</small></div>
                        <button class="del-btn" onclick="removeFromCart(${item.id})">Remove</button>
                    </div>
                `;
            });
            document.getElementById('count').innerText = cart.length;
            document.getElementById('total-price').innerText = total.toFixed(2);
        }

        function searchProducts() {
            let input = document.getElementById('search-bar').value.toLowerCase();
            let cards = document.getElementsByClassName('item-card');
            for (let card of cards) {
                let name = card.getAttribute('data-name').toLowerCase();
                card.style.display = name.includes(input) ? "block" : "none";
            }
        }

        function showToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = msg;
            t.style.bottom = "30px";
            setTimeout(() => { t.style.bottom = "-100px"; }, 2000);
        }

        function saveConfig() {
            const name = document.getElementById('new-name').value;
            const phone = document.getElementById('owner-phone').value;
            const map = document.getElementById('new-map').value;
            const pN = document.getElementById('p-name').value;
            const pP = parseFloat(document.getElementById('p-price').value);
            const pI = document.getElementById('p-img').value || 'https://via.placeholder.com/150';

            if(name) document.getElementById('shop-title').innerText = name;
            if(phone) waPhone = phone;
            if(map) document.getElementById('loc-map').src = map;

            if(pN && pP) {
                const grid = document.getElementById('product-list');
                const div = document.createElement('div');
                div.className = 'item-card';
                div.setAttribute('data-name', pN);
                div.innerHTML = `<img src="${pI}"><h3>${pN}</h3><p style="color:var(--accent); font-weight:bold;">€ ${pP.toFixed(2)}</p><button class="btn-add" onclick="addToCart('${pN}', ${pP})">Add to Cart</button>`;
                grid.appendChild(div);
            }
            toggleAdmin();
            alert("Rifat Mini Market System Updated!");
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return alert("Cart is empty!");
            let list = cart.map(i => `- ${i.name} (€${i.price.toFixed(2)})`).join('%0A');
            let total = document.getElementById('total-price').innerText;
            let text = `Hello Rifat Mini Market! 🇬🇷%0AI want to order:%0A${list}%0A%0ATotal Price: €${total}%0APlease confirm my order.`;
            window.open(`https://wa.me/${waPhone}?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
