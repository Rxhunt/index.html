<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIFAT MINI MARKET | Athens</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff4757;
            --glass: rgba(255, 255, 255, 0.7);
            --border: rgba(255, 255, 255, 0.5);
            --ios-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s; }
        body { margin: 0; background: #f0f2f5; color: #2d3436; overflow-x: hidden; }

        /* Flags & Header */
        .top-bar { padding: 5px 20px; background: white; display: flex; justify-content: space-between; font-size: 14px; }
        header {
            position: sticky; top: 10px; margin: 0 15px;
            background: var(--glass); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 12px 25px; display: flex; justify-content: space-between;
            align-items: center; z-index: 1000; box-shadow: var(--ios-shadow);
        }

        .shop-name { font-family: 'Syncopate'; font-size: 14px; color: #d63031; }

        /* Search & Hero */
        .search-area { margin: 40px 20px 20px; text-align: center; }
        #search-bar {
            width: 100%; max-width: 600px; padding: 15px 25px;
            border-radius: 50px; border: none; background: white;
            box-shadow: var(--ios-shadow); outline: none; font-size: 16px;
        }

        /* Product Grid */
        .container { padding: 0 20px 40px; max-width: 1200px; margin: auto; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }

        .item-card {
            background: white; border-radius: 30px; padding: 15px;
            text-align: center; box-shadow: var(--ios-shadow); position: relative;
        }
        .item-card img { width: 100%; height: 180px; object-fit: contain; border-radius: 20px; background: #f9f9f9; }
        .item-card h3 { font-size: 18px; margin: 10px 0 5px; }
        .price { color: var(--accent); font-weight: 700; font-size: 20px; }

        /* Buttons */
        .btn-ios {
            background: #2d3436; color: white; border: none; width: 100%;
            padding: 12px; border-radius: 15px; cursor: pointer; font-weight: 600;
        }
        .btn-ios:active { transform: scale(0.95); }

        /* Cart & Sidebar */
        #cart-sidebar {
            position: fixed; right: -100%; top: 0; width: 380px; height: 100%;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            z-index: 5000; padding: 30px; box-shadow: -10px 0 30px rgba(0,0,0,0.1);
        }
        #cart-sidebar.open { right: 0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .remove-btn { color: #ff4757; cursor: pointer; font-size: 12px; font-weight: bold; border: 1px solid #ff4757; padding: 2px 8px; border-radius: 8px; }

        /* Cute Notification */
        #toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: #2ecc71; color: white; padding: 12px 25px;
            border-radius: 50px; font-weight: bold; z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Admin Controls */
        .admin-icon { position: fixed; bottom: 20px; left: 20px; background: #000; color: white; padding: 15px; border-radius: 50%; cursor: pointer; z-index: 6000; }
        #admin-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 7000; color: white; }
        .admin-card { background: #fff; color: #333; padding: 30px; border-radius: 30px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>📍 Athens, Greece 🇬🇷</span>
        <span>Made with ❤️ for 🇧🇩</span>
    </div>

    <header>
        <div class="shop-name" id="shop-title-header">RIFAT MINI MARKET</div>
        <div onclick="toggleCart()" style="cursor:pointer; font-size: 18px;">🛒 <span id="cart-count" style="background:red; color:white; padding:2px 8px; border-radius:50%; font-size:12px;">0</span></div>
    </header>

    <div class="search-area">
        <input type="text" id="search-bar" placeholder="Search for groceries in Athens..." onkeyup="searchFilter()">
    </div>

    <div class="container">
        <div class="product-grid" id="main-grid">
            <div class="item-card" data-name="Fresh Eggs">
                <img src="https://images.unsplash.com/photo-1582722872445-44ad5c789d75?w=400" alt="Eggs">
                <h3>Fresh Eggs (12 pcs)</h3>
                <div class="price">€ 3.50</div>
                <button class="btn-ios" onclick="addItem('Fresh Eggs', 3.50)">Add to Cart</button>
            </div>
        </div>

        <div style="margin-top: 40px; border-radius: 20px; overflow: hidden; height: 250px; border: 5px solid white;">
            <iframe id="google-map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m13!1d3144.89!2d23.7275!3d37.9838!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14a1bd1f4400!2sAthens!5e0!3m2!1sen!2sgr!4v1600000000000" width="100%" height="100%" frameborder="0" style="border:0;" allowfullscreen=""></iframe>
        </div>
    </div>

    <div id="cart-sidebar">
        <h2 style="font-family:'Syncopate'; font-size: 18px;">Basket</h2>
        <div id="cart-items-list"></div>
        <div style="margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;">
            <h3>Total: € <span id="total-price">0.00</span></h3>
            <button class="btn-ios" style="background:#27ae60;" onclick="sendOrder()">Send Order via WhatsApp</button>
            <p onclick="toggleCart()" style="text-align:center; margin-top:15px; cursor:pointer; color:#999;">Close</p>
        </div>
    </div>

    <div id="toast">Added to Cart! 🛒</div>

    <div class="admin-icon" onclick="openAdmin()">⚙️</div>
    <div id="admin-panel">
        <div class="admin-card" id="admin-content">
            <div id="login-box">
                <h2>Admin Login</h2>
                <input type="password" id="admin-pass" placeholder="Enter Password">
                <button class="btn-ios" onclick="checkPass()">Login</button>
                <p onclick="closeAdmin()" style="cursor:pointer; color:red; text-align:center;">Exit</p>
            </div>
            
            <div id="dashboard" style="display:none;">
                <h3>Shop Management</h3>
                <input type="text" id="wa-num" placeholder="WhatsApp Number (e.g. 3069...)">
                <input type="text" id="map-src" placeholder="Google Maps Embed Link">
                <hr>
                <h3>Add New Product</h3>
                <input type="text" id="new-p-name" placeholder="Product Name">
                <input type="number" id="new-p-price" step="0.01" placeholder="Price €">
                <input type="text" id="new-p-img" placeholder="Image Link (URL)">
                <button class="btn-ios" style="background:#0984e3;" onclick="saveProduct()">Update Website</button>
                <button class="btn-ios" style="background:#ccc; margin-top:10px;" onclick="closeAdmin()">Finish & Log Out</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let waNumber = "306900000000"; // Default
        const ADMIN_PASS = "rifat123"; // Apnar Manager Password

        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('open'); }
        function openAdmin() { document.getElementById('admin-panel').style.display = 'flex'; }
        function closeAdmin() { 
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login-box').style.display = 'block';
        }

        function checkPass() {
            if(document.getElementById('admin-pass').value === ADMIN_PASS) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else { alert("Incorrect Password!"); }
        }

        function addItem(name, price) {
            cart.push({ name, price, id: Date.now() });
            renderCart();
            showToast(name + " Added! 🛍️");
        }

        function removeItem(id) {
            cart = cart.filter(item => item.id !== id);
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                list.innerHTML += `
                    <div class="cart-item">
                        <span><b>${item.name}</b><br>€${item.price.toFixed(2)}</span>
                        <span class="remove-btn" onclick="removeItem(${item.id})">Delete</span>
                    </div>
                `;
            });
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('total-price').innerText = total.toFixed(2);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.top = "30px";
            setTimeout(() => { t.style.top = "-100px"; }, 2000);
        }

        function searchFilter() {
            let val = document.getElementById('search-bar').value.toLowerCase();
            let cards = document.getElementsByClassName('item-card');
            for(let card of cards) {
                let name = card.getAttribute('data-name').toLowerCase();
                card.style.display = name.includes(val) ? "block" : "none";
            }
        }

        function saveProduct() {
            const name = document.getElementById('new-p-name').value;
            const price = parseFloat(document.getElementById('new-p-price').value);
            const img = document.getElementById('new-p-img').value || 'https://via.placeholder.com/200';
            const map = document.getElementById('map-src').value;
            const phone = document.getElementById('wa-num').value;

            if(phone) waNumber = phone;
            if(map) document.getElementById('google-map').src = map;

            if(name && price) {
                const grid = document.getElementById('main-grid');
                const div = document.createElement('div');
                div.className = 'item-card';
                div.setAttribute('data-name', name);
                div.innerHTML = `
                    <img src="${img}">
                    <h3>${name}</h3>
                    <div class="price">€ ${price.toFixed(2)}</div>
                    <button class="btn-ios" onclick="addItem('${name}', ${price})">Add to Cart</button>
                `;
                grid.appendChild(div);
                alert("Product Added Successfully!");
            }
        }

        function sendOrder() {
            if(cart.length === 0) return alert("Cart is empty!");
            let list = cart.map(i => `- ${i.name} (€${i.price.toFixed(2)})`).join('%0A');
            let total = document.getElementById('total-price').innerText;
            let msg = `🛒 *RIFAT MINI MARKET ORDER*%0A--------------------------%0A${list}%0A--------------------------%0A*Total: €${total}*%0A%0APlease process my order in Athens.`;
            window.open(`https://wa.me/${waNumber}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
