<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RXHUNT v16.0 | SECURE OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ffaa;
            --neon-alt: #0088ff;
            --glass: rgba(0, 0, 0, 0.9);
            --border: rgba(0, 255, 170, 0.3);
        }

        * { box-sizing: border-box; cursor: crosshair; transition: all 0.3s ease; }
        body {
            margin: 0; background: #000; color: var(--neon);
            font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden;
        }

        /* --- Full Screen Lock Layer --- */
        #master-lock {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(50px);
        }
        .lock-box {
            width: 300px; padding: 30px; border: 1px solid var(--neon);
            text-align: center; background: rgba(0, 255, 170, 0.05);
            box-shadow: 0 0 50px rgba(0, 255, 170, 0.2);
        }
        .lock-box h2 { font-family: 'Syncopate'; font-size: 14px; margin-bottom: 20px; }
        .lock-input {
            background: #000; border: 1px solid var(--neon); color: var(--neon);
            padding: 12px; width: 100%; text-align: center; font-size: 18px; outline: none;
            margin-bottom: 15px; letter-spacing: 5px;
        }
        .unlock-btn {
            background: var(--neon); color: #000; border: none; width: 100%;
            padding: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .unlock-btn:hover { background: #fff; box-shadow: 0 0 20px var(--neon); }

        /* --- Main UI (Hidden initially) --- */
        #main-os { display: none; opacity: 0; }

        /* --- Original Styles from v16.0 --- */
        .status-header { position: fixed; top: 0; width: 100%; height: 45px; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); z-index: 1000; }
        .side-monitor { position: fixed; right: 20px; top: 70px; width: 260px; display: flex; flex-direction: column; gap: 15px; z-index: 500; }
        .data-card { background: var(--glass); border: 1px solid var(--border); padding: 15px; border-radius: 5px 20px 5px 20px; backdrop-filter: blur(20px); box-shadow: 0 0 20px rgba(0, 255, 170, 0.1); }
        .data-label { font-family: 'Syncopate'; font-size: 9px; opacity: 0.7; margin-bottom: 8px; }
        .bar-container { height: 4px; background: #111; margin: 8px 0; border-radius: 2px; }
        .bar-fill { height: 100%; background: var(--neon); box-shadow: 0 0 10px var(--neon); }
        .win-terminal { position: absolute; top: 80px; left: 40px; right: 300px; bottom: 120px; background: rgba(0, 5, 5, 0.98); border: 1px solid var(--neon); display: none; flex-direction: column; overflow: hidden; border-radius: 10px; box-shadow: 0 0 40px rgba(0, 255, 170, 0.2); }
        .win-title { padding: 12px 20px; background: rgba(0, 255, 170, 0.1); display: flex; justify-content: space-between; font-family: 'Syncopate'; font-size: 11px; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        .dock { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; padding: 12px 25px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(35px); border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.2); z-index: 1000; }
        .dock-item { width: 55px; height: 55px; border-radius: 15px; display: flex; justify-content: center; align-items: center; background: #000; border: 1px solid var(--border); font-size: 22px; cursor: pointer;}
        input[type="text"], input[type="password"] { background: #000; border: 1px solid var(--border); color: var(--neon); padding: 10px; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="master-lock">
        <div class="lock-box">
            <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
            <h2>SYSTEM_LOCKED</h2>
            <input type="password" id="pass-input" class="lock-input" placeholder="••••">
            <button class="unlock-btn" onclick="checkPass()">ACCESS_VAULT</button>
            <p id="error-msg" style="color: red; font-size: 10px; margin-top: 10px; display: none;">ACCESS_DENIED: WRONG_KEY</p>
        </div>
    </div>

    <div id="main-os">
        <div class="status-header">
            <span style="font-family: 'Syncopate'; font-size: 12px;">RXHUNT // SECURE_OS_v16.0</span>
            <span id="digital-clock" style="font-size: 18px;">00:00:00</span>
            <span style="color: var(--neon);">STATUS: ENCRYPTED</span>
        </div>

        <div class="side-monitor">
            <div class="data-card">
                <div class="data-label">HARDWARE</div>
                <div style="font-size: 11px;">BATTERY: 98%</div>
                <div class="bar-container"><div class="bar-fill" style="width: 98%;"></div></div>
                <div style="font-size: 11px; margin-top:10px;">CPU: 14%</div>
                <div class="bar-container"><div class="bar-fill" style="width: 14%; background: var(--neon-alt);"></div></div>
            </div>
            <div class="data-card">
                <div class="data-label">ENVIRONMENT</div>
                <div style="font-size: 18px; font-weight: bold;">SYLHET: 23°C</div>
            </div>
        </div>

        <div id="win-controller" class="win-terminal" style="display: flex;">
            <div class="win-title"><span>COMMAND_CENTER</span></div>
            <div style="padding: 20px;">
                <h3>UNIVERSAL CONTROLLER</h3>
                <input id="ctrl-name" type="text" placeholder="APP_NAME">
                <input id="ctrl-url" type="text" placeholder="URL (https://...)">
                <button onclick="addToController()" style="background:var(--neon); color:#000; border:none; padding:10px; width:100%; cursor:pointer;">ADD_SYSTEM</button>
                <div id="dynamic-apps" style="margin-top:20px; display: grid; grid-template-columns: repeat(3, 1fr); gap:10px;"></div>
            </div>
        </div>

        <div id="win-viewer" class="win-terminal">
            <div class="win-title"><span id="viewer-name">VIEWER</span> <button onclick="closeWin('win-viewer')" style="color:red; background:none; border:none;">[EXIT]</button></div>
            <iframe id="app-frame" src=""></iframe>
        </div>

        <nav class="dock">
            <div class="dock-item" onclick="openWin('win-controller')">🎮</div>
            <div class="dock-item" onclick="launchApp('Gemini', 'https://gemini.google.com')">🧠</div>
            <div class="dock-item" onclick="launchApp('YouTube', 'https://www.youtube.com')">📺</div>
            <div class="dock-item" onclick="openWin('win-settings')">⚙️</div>
        </nav>
    </div>

    <script>
        // --- PASSKEY CONFIGURATION ---
        const MASTER_KEY = "1234"; // এখান থেকে তুমি তোমার পাসকি পরিবর্তন করতে পারো

        function checkPass() {
            let input = document.getElementById('pass-input').value;
            if(input === MASTER_KEY) {
                document.getElementById('master-lock').style.display = 'none';
                document.getElementById('main-os').style.display = 'block';
                setTimeout(() => { document.getElementById('main-os').style.opacity = '1'; }, 100);
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('pass-input').value = "";
            }
        }

        // --- OS Logic ---
        function openWin(id) { 
            document.querySelectorAll('.win-terminal').forEach(w => w.style.display = 'none');
            document.getElementById(id).style.display = 'flex'; 
        }
        function closeWin(id) { document.getElementById(id).style.display = 'none'; }

        function launchApp(name, url) {
            document.getElementById('viewer-name').innerText = name.toUpperCase();
            document.getElementById('app-frame').src = url;
            openWin('win-viewer');
        }

        setInterval(() => { document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString(); }, 1000);

        // Enter key support for login
        document.getElementById("pass-input").addEventListener("keyup", function(event) {
            if (event.keyCode === 13) { checkPass(); }
        });
    </script>
</body>
</html>
